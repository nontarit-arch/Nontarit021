<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Airplane Figure 8</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* บังคับให้ video/canvas ของ AR.js เต็มจอเสมอ ไม่ให้ค้างสเกลผิด */
    #arjs-video, video, .a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    #speedButton {
      position: fixed;
      z-index: 9999;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      padding: 16px 30px;
      border: none;
      border-radius: 50px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      font-size: 18px;
      font-weight: bold;

      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #speedButton:active {
      transform: translateX(-50%) scale(0.95);
    }

    #speedText {
      position: fixed;
      z-index: 9999;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      padding: 8px 16px;
      border-radius: 20px;

      background: rgba(0,0,0,0.6);
      color: white;

      font-size: 15px;
    }
  </style>
</head>

<body>

  <div id="speedText">ความเร็ว: 1x</div>
  <button id="speedButton">✈️ เพิ่มความเร็ว</button>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true"
    arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;">

    <!-- Hiro Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true">

      <!-- เครื่องบินลำที่ 1 -->
      <a-entity
        id="plane1"
        position="0 0.8 0"
        scale="0.45 0.45 0.45">

        <!-- ลำตัว -->
        <a-box
          position="0 0 0"
          depth="1.6"
          height="0.18"
          width="0.22"
          color="#eeeeee">
        </a-box>

        <!-- ปีก -->
        <a-box
          position="0 0 0"
          depth="0.25"
          height="0.08"
          width="1.8"
          color="#2196f3">
        </a-box>

        <!-- หาง -->
        <a-box
          position="0 0.08 0.65"
          depth="0.35"
          height="0.35"
          width="0.08"
          color="#1976d2">
        </a-box>

        <!-- ปีกหาง -->
        <a-box
          position="0 0 0.65"
          depth="0.2"
          height="0.05"
          width="0.65"
          color="#1976d2">
        </a-box>

        <!-- จมูก -->
        <a-cone
          position="0 0 -0.9"
          rotation="90 0 0"
          radius-bottom="0.15"
          radius-top="0"
          height="0.35"
          color="#ffffff">
        </a-cone>
      </a-entity>


      <!-- เครื่องบินลำที่ 2 -->
      <a-entity
        id="plane2"
        position="0 1.1 0"
        scale="0.38 0.38 0.38"
        rotation="0 120 0">

        <a-box
          depth="1.6"
          height="0.18"
          width="0.22"
          color="#eeeeee">
        </a-box>

        <a-box
          position="0 0 0"
          depth="0.25"
          height="0.08"
          width="1.8"
          color="#f44336">
        </a-box>

        <a-box
          position="0 0.08 0.65"
          depth="0.35"
          height="0.35"
          width="0.08"
          color="#c62828">
        </a-box>

        <a-box
          position="0 0 0.65"
          depth="0.2"
          height="0.05"
          width="0.65"
          color="#c62828">
        </a-box>

        <a-cone
          position="0 0 -0.9"
          rotation="90 0 0"
          radius-bottom="0.15"
          radius-top="0"
          height="0.35"
          color="#ffffff">
        </a-cone>
      </a-entity>


      <!-- เครื่องบินลำที่ 3 -->
      <a-entity
        id="plane3"
        position="0 1.4 0"
        scale="0.32 0.32 0.32"
        rotation="0 240 0">

        <a-box
          depth="1.6"
          height="0.18"
          width="0.22"
          color="#eeeeee">
        </a-box>

        <a-box
          position="0 0 0"
          depth="0.25"
          height="0.08"
          width="1.8"
          color="#4caf50">
        </a-box>

        <a-box
          position="0 0.08 0.65"
          depth="0.35"
          height="0.35"
          width="0.08"
          color="#2e7d32">
        </a-box>

        <a-box
          position="0 0 0.65"
          depth="0.2"
          height="0.05"
          width="0.65"
          color="#2e7d32">
        </a-box>

        <a-cone
          position="0 0 -0.9"
          rotation="90 0 0"
          radius-bottom="0.15"
          radius-top="0"
          height="0.35"
          color="#ffffff">
        </a-cone>
      </a-entity>

    </a-marker>

    <!-- กล้อง AR -->
    <a-entity camera></a-entity>

  </a-scene>


<script>

  // ==========================================
  // ตั้งค่า
  // ==========================================

  let speed = 1;

  let time = 0;

  const planes = [
    document.querySelector("#plane1"),
    document.querySelector("#plane2"),
    document.querySelector("#plane3")
  ];

  const speedText = document.querySelector("#speedText");
  const speedButton = document.querySelector("#speedButton");


  // ==========================================
  // แก้ปัญหากล้องซูมเข้าใกล้เกินไป
  // ==========================================
  // สาเหตุ: AR.js คำนวณขนาด video/canvas ตอนโหลดครั้งแรกจาก
  // sourceWidth/sourceHeight เทียบกับขนาดจอ ถ้าไม่ re-calculate
  // เมื่อจอเปลี่ยนขนาด (โดยเฉพาะมือถือที่หมุนจอ หรือ browser UI
  // ยุบ/ขยาย) ภาพจะถูก scale ผิดสัดส่วนจนดูเหมือน "ซูม"
  // การเรียก arSystem._resize() ใหม่จะบังคับให้คำนวณ
  // ขนาด/สัดส่วนกล้องใหม่ให้ตรงกับจอปัจจุบัน กลับสู่ระยะ 1x ปกติ

  const sceneEl = document.querySelector("a-scene");

  function fixArjsZoom() {
    const arSystem = sceneEl.systems && sceneEl.systems["arjs"];
    if (arSystem && typeof arSystem._resize === "function") {
      arSystem._resize();
    }
  }

  sceneEl.addEventListener("loaded", function () {
    // เรียกซ้ำหลังโหลดเสร็จ เผื่อ webcam stream พร้อมช้ากว่า scene
    setTimeout(fixArjsZoom, 500);
    setTimeout(fixArjsZoom, 1500);
  });

  window.addEventListener("resize", function () {
    setTimeout(fixArjsZoom, 300);
  });

  window.addEventListener("orientationchange", function () {
    setTimeout(fixArjsZoom, 500);
  });


  // ==========================================
  // เพิ่มความเร็ว
  // ==========================================

  speedButton.addEventListener("click", function () {

    speed += 0.5;

    if (speed > 5) {
      speed = 1;
    }

    speedText.innerText = "ความเร็ว: " + speed.toFixed(1) + "x";

  });


  // ==========================================
  // คำนวณตำแหน่งเส้นทางเลข 8
  // ==========================================

  function figureEight(t, phase, radiusX, radiusZ) {

    /*
      Parametric figure 8

      x = sin(t)
      z = sin(t) * cos(t)

      ทำให้เกิดรูปเลข 8
    */

    const x =
      radiusX *
      Math.sin(t + phase);

    const z =
      radiusZ *
      Math.sin(t + phase) *
      Math.cos(t + phase);

    return {
      x: x,
      z: z
    };
  }


  // ==========================================
  // Animation
  // ==========================================

  function animate() {

    requestAnimationFrame(animate);

    time += 0.015 * speed;


    planes.forEach((plane, index) => {

      // ให้แต่ละลำบินเหลื่อมกัน
      const phase =
        index * (Math.PI * 2 / 3);

      const pos =
        figureEight(
          time,
          phase,
          2.2,
          2.0
        );


      // ความสูงแต่ละลำไม่เท่ากัน
      const height =
        0.9 +
        index * 0.35 +
        Math.sin(time * 2 + phase) * 0.15;


      // ตั้งตำแหน่ง
      plane.object3D.position.x = pos.x;
      plane.object3D.position.y = height;
      plane.object3D.position.z = pos.z;


      // =====================================
      // คำนวณทิศทางการบิน
      // =====================================

      const nextT =
        time + 0.01;

      const next =
        figureEight(
          nextT,
          phase,
          2.2,
          2.0
        );


      const dx =
        next.x - pos.x;

      const dz =
        next.z - pos.z;


      const angle =
        Math.atan2(dx, dz);


      // หมุนเครื่องบินตามทิศทาง
      plane.object3D.rotation.y =
        angle;


      // เอียงเครื่องบินตอนเลี้ยว
      const banking =
        Math.sin(time + phase) * 0.25;

      plane.object3D.rotation.z =
        banking;

    });

  }


  // เริ่ม Animation
  animate();


  // ==========================================
  // เมื่อพบ Hiro Marker
  // ==========================================

  const marker =
    document.querySelector("#hiroMarker");

  marker.addEventListener(
    "markerFound",
    function () {

      speedText.innerText =
        "พบ Hiro Marker • ความเร็ว: " +
        speed.toFixed(1) +
        "x";

    }
  );


  marker.addEventListener(
    "markerLost",
    function () {

      speedText.innerText =
        "ค้นหา Hiro Marker...";

    }
  );

</script>

</body>
</html>
