  </style>

  <script>
    /*
      ------------------------------------------------------------
      MACHINE CLICK HANDLER
      ------------------------------------------------------------
      Clicking a machine displays a short description.
    */
    AFRAME.registerComponent("machine-click", {
      schema: {
        name: { type: "string" },
        functionText: { type: "string" },
        color: { type: "string", default: "#2196f3" }
      },

      init: function () {
        const el = this.el;

        el.addEventListener("click", () => {
          const panel = document.querySelector("#machineInfo");

          panel.style.display = "block";
          panel.style.borderLeftColor = this.data.color;

          panel.innerHTML =
            "<h3>" + this.data.name + "</h3>" +
            "<p>" + this.data.functionText + "</p>" +
            "<p><strong>Click another machine</strong> to inspect it.</p>";
        });

        /*
          Give the machine a small visual response when the mouse
          pointer enters/leaves its clickable area.
        */
        el.addEventListener("mouseenter", () => {
          el.setAttribute("material", "opacity", 0.12);
        });

        el.addEventListener("mouseleave", () => {
          el.setAttribute("material", "opacity", 0.01);
        });
      }
    });

    /*
      ------------------------------------------------------------
      CONVEYOR CARRIER
      ------------------------------------------------------------
      Each HDD carrier travels from left to right through the
      three production stations.
    */
    AFRAME.registerComponent("carrier-motion", {
      init: function () {
        const el = this.el;

        el.addEventListener("animationcomplete", function () {
          /*
            Once the carrier reaches the end, start again.
            This keeps the production line running continuously.
          */
          el.setAttribute("position", "-11 0.62 1.05");
        });
      }
    });
  </script>
