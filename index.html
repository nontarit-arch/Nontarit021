    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: transparent;
    }


    /* =========================================
       แถบปุ่มควบคุม
       ใช้ flexbox + ขนาดปรับตามหน้าจอด้วย clamp()
       แทนขนาด fixed px ที่ใหญ่เกินไปเดิม
    ========================================== */

    #controls {

      position: fixed;
      z-index: 9999;

      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;

      width: 100%;
      max-width: 480px;

      padding: 0 12px;
      box-sizing: border-box;
    }


    .ctrlButton {

      flex: 0 1 auto;

      border: none;
      border-radius: 40px;

      /* padding/font ปรับตามความกว้างจอ ไม่ล้นจอเล็ก ไม่เล็กเกินจอใหญ่ */
      padding: clamp(10px, 2.6vw, 16px) clamp(16px, 4.5vw, 26px);
      font-size: clamp(13px, 3.6vw, 17px);
      font-weight: bold;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
      cursor: pointer;

      white-space: nowrap;

      -webkit-tap-highlight-color: transparent;
    }

    .ctrlButton:active {
      transform: scale(0.95);
    }

    /* สถานะ active ของปุ่ม toggle (หยุดบิน / ควงสว่าน) */
    .ctrlButton.active {
      background: rgba(33, 150, 243, 0.9);
    }


    /* =========================================
       ข้อความความเร็ว
    ========================================== */

    #speedText {

      position: fixed;

      z-index: 9999;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      padding: 8px 16px;

      border-radius: 20px;

      background: rgba(0,0,0,0.6);

      color: white;

      font-size: clamp(12px, 3.5vw, 15px);

      white-space: nowrap;

  <script>

    // =========================================
    // สถานะการบิน
    // =========================================

    let speed = 1;

    let time = 0;

    // เวลาสำหรับการควงสว่าน แยกจาก time หลัก
    // เพื่อให้หมุนได้ต่อเนื่องด้วยความเร็วของตัวเอง
    let rollTime = 0;

    // true = กำลังบิน, false = หยุดนิ่ง (แช่ตำแหน่งปัจจุบัน)
    let isFlying = true;

    // true = กำลังหมุนควงสว่าน (barrel roll) รอบแกนลำตัวเครื่องบิน
    let isBarrelRolling = false;



    // =========================================
    // เครื่องบินทั้ง 8 ลำ
    // =========================================

    const planes = [

      document.querySelector("#plane1"),

      document.querySelector("#plane2"),

      document.querySelector("#plane3"),

      document.querySelector("#plane4"),

      document.querySelector("#plane5"),

      document.querySelector("#plane6"),

      document.querySelector("#plane7"),

      document.querySelector("#plane8")

    ];



    const speedText =
      document.querySelector("#speedText");


    const speedButton =
      document.querySelector("#speedButton");


    const stopButton =
      document.querySelector("#stopButton");


    const barrelButton =
      document.querySelector("#barrelButton");



    // =========================================
    // ปุ่มเพิ่มความเร็ว
    // =========================================

    speedButton.addEventListener(
      "click",
      function () {

        speed += 0.5;


        if (speed > 5) {

          speed = 1;

        }


        updateSpeedText();

      }
    );



    // =========================================
    // ปุ่มหยุดบิน / บินต่อ
    // =========================================

    stopButton.addEventListener(
      "click",
      function () {

        isFlying = !isFlying;

        stopButton.textContent =
          isFlying
            ? "⏸️ หยุดบิน"
            : "▶️ บินต่อ";

        stopButton.classList.toggle(
          "active",
          !isFlying
        );

        updateSpeedText();

      }
    );



    // =========================================
    // ปุ่มหมุนควงสว่าน
    // =========================================

    barrelButton.addEventListener(
      "click",
      function () {

        isBarrelRolling = !isBarrelRolling;

        barrelButton.classList.toggle(
          "active",
          isBarrelRolling
        );

        updateSpeedText();

      }
    );



    // =========================================
    // อัปเดตข้อความสถานะด้านบน
    // =========================================

    function updateSpeedText() {

      let status = "ความเร็ว: " + speed.toFixed(1) + "x";

      if (!isFlying) {
        status += " • หยุดนิ่ง";
      }

      if (isBarrelRolling) {
        status += " • 🌀 ควงสว่าน";
      }

      speedText.innerText = status;

    }



    // =========================================
    // ฟังก์ชันเส้นทางเลข 8
    // =========================================

    function figureEight(
      t,
      phase,
      radiusX,
      radiusZ
    ) {

      const x =
        radiusX *
        Math.sin(t + phase);


      const z =
        radiusZ *
        Math.sin(t + phase) *
        Math.cos(t + phase);


      return {

        x: x,

        z: z

      };

    }



    // =========================================
    // Animation
    // =========================================

    function animate() {


      requestAnimationFrame(
        animate
      );


      // หยุดอัปเดตตำแหน่ง/การหมุนถ้ากดหยุดบิน
      // (ยังคง requestAnimationFrame ไว้เพื่อให้กดบินต่อได้ทันที)
      if (!isFlying) {
        return;
      }


      time +=
        0.015 *
        speed;


      // ควงสว่านหมุนเร็วกว่าการเอียงปกติ และเดินตามความเร็วที่เลือกด้วย
      if (isBarrelRolling) {
        rollTime += 0.12 * speed;
      }



      planes.forEach(
        function (
          plane,
          index
        ) {


          // ===================================
          // 8 ลำ
          // กระจายทุก 45 องศา
          // ===================================

          const phase =
            index *
            (
              Math.PI * 2 / 8
            );



          // ===================================
          // ขนาดวงบิน
          // แคบกว่าของเดิม
          // ===================================

          const pos =
            figureEight(

              time,

              phase,

              1.10,

              1.00

            );



          // ===================================
          // ความสูง
          // ===================================

          const height =

            0.65 +

            index * 0.12 +

            Math.sin(
              time * 2 +
              phase
            ) * 0.08;



          // ===================================
          // ตำแหน่ง
          // ===================================

          plane.object3D.position.x =
            pos.x;


          plane.object3D.position.y =
            height;


          plane.object3D.position.z =
            pos.z;



          // ===================================
          // คำนวณทิศทาง
          // ===================================

          const nextT =
            time + 0.01;



          const next =
            figureEight(

              nextT,

              phase,

              1.10,

              1.00

            );



          const dx =
            next.x -
            pos.x;


          const dz =
            next.z -
            pos.z;



          const angle =
            Math.atan2(
              dx,
              dz
            );



          // ===================================
          // หมุนเครื่องบิน (หันหัวตามทิศทาง)
          // ===================================

          plane.object3D.rotation.y =
            angle;



          // ===================================
          // เอียง / ควงสว่านรอบแกนลำตัว
          // ===================================
          // ปกติ: เอียงเล็กน้อยตอนเลี้ยว (banking)
          // เมื่อกดควงสว่าน: หมุนรอบแกน Z ต่อเนื่องเต็มรอบ
          //                  (แต่ละลำเหลื่อมเฟสกันตาม phase
          //                   เพื่อไม่ให้หมุนพร้อมกันดูแข็งเกินไป)

          if (isBarrelRolling) {

            plane.object3D.rotation.z =
              rollTime + phase;

          } else {

            const banking =

              Math.sin(
                time +
                phase
              ) * 0.25;


            plane.object3D.rotation.z =
              banking;

          }

        }
      );

    }



    // =========================================
    // เริ่ม Animation
    // =========================================

    animate();



    // =========================================
    // Hiro Marker
    // =========================================

    const marker =
      document.querySelector(
        "#hiroMarker"
      );



    marker.addEventListener(
      "markerFound",
      function () {

        updateSpeedText();

      }
    );



    marker.addEventListener(
      "markerLost",
      function () {

        speedText.innerText =

          "ค้นหา Hiro Marker...";

      }
    );

  </script>
