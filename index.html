<script>


/* =====================================================
   ตัวแปร
===================================================== */

let speed = 1;

let time = 0;

let markerDetected = false;


const planes = [

  document.querySelector("#plane1"),

  document.querySelector("#plane2"),

  document.querySelector("#plane3")

];


const speedText =
  document.querySelector("#speedText");


const speedButton =
  document.querySelector("#speedButton");


const cameraStatus =
  document.querySelector("#cameraStatus");


const marker =
  document.querySelector("#hiroMarker");



/* =====================================================
   ปุ่มเพิ่มความเร็ว
===================================================== */

speedButton.addEventListener(

  "click",

  function() {

    speed += 0.5;


    if (speed > 5) {

      speed = 1;

    }


    speedText.innerText =
      "ความเร็ว: " +
      speed.toFixed(1) +
      "x";

  }

);



/* =====================================================
   Hiro Marker Found
===================================================== */

marker.addEventListener(

  "markerFound",

  function() {

    markerDetected = true;

    speedText.innerText =
      "พบ Hiro Marker • ความเร็ว: " +
      speed.toFixed(1) +
      "x";

  }

);



/* =====================================================
   Hiro Marker Lost
===================================================== */

marker.addEventListener(

  "markerLost",

  function() {

    markerDetected = false;

    speedText.innerText =
      "ค้นหา Hiro Marker...";

  }

);



/* =====================================================
   เส้นทางเลข 8
===================================================== */

function figureEight(

  t,

  phase,

  radiusX,

  radiusZ

) {

  const x =

    radiusX *
    Math.sin(
      t + phase
    );


  const z =

    radiusZ *
    Math.sin(
      t + phase
    ) *
    Math.cos(
      t + phase
    );


  return {

    x: x,

    z: z

  };

}



/* =====================================================
   Animation
===================================================== */

function animate() {


  requestAnimationFrame(
    animate
  );


  if (!markerDetected) {

    return;

  }


  time +=
    0.015 * speed;


  planes.forEach(

    function(
      plane,
      index
    ) {


      const phase =

        index *
        (
          Math.PI * 2 / 3
        );


      /*
         ลดขนาดวงบิน
         ให้เหมาะกับ Marker
      */

      const pos =

        figureEight(

          time,

          phase,

          1.45,

          1.15

        );


      /*
         ความสูง
      */

      const height =

        0.8 +

        index * 0.30 +

        Math.sin(
          time * 2 +
          phase
        ) * 0.08;


      plane.object3D.position.x =
        pos.x;


      plane.object3D.position.y =
        height;


      plane.object3D.position.z =
        pos.z;


      /*
         หาจุดด้านหน้า
      */

      const next =

        figureEight(

          time + 0.03,

          phase,

          1.45,

          1.15

        );


      const dx =
        next.x - pos.x;


      const dz =
        next.z - pos.z;


      const angle =
        Math.atan2(
          dx,
          dz
        );


      plane.object3D.rotation.y =
        angle;


      /*
         เอียงตอนเข้าโค้ง
      */

      plane.object3D.rotation.z =

        Math.sin(
          time + phase
        ) * 0.22;

    }

  );

}


animate();



/* =====================================================
   บังคับกล้อง Zoom 1x
===================================================== */

async function forceCameraZoom1x() {

  try {

    const video =
      document.querySelector("video");


    /*
       AR.js ยังไม่เปิดกล้อง
    */

    if (
      !video ||
      !video.srcObject
    ) {

      setTimeout(
        forceCameraZoom1x,
        500
      );

      return;

    }


    const tracks =
      video.srcObject
        .getVideoTracks();


    if (!tracks.length) {

      return;

    }


    const track =
      tracks[0];


    const capabilities =
      track.getCapabilities();


    console.log(
      "Camera capabilities:",
      capabilities
    );


    /*
       ตรวจสอบว่ากล้อง
       รองรับ Zoom หรือไม่
    */

    if (capabilities.zoom) {


      const minZoom =
        capabilities.zoom.min;


      const maxZoom =
        capabilities.zoom.max;


      /*
         พยายามกำหนด 1x
      */

      const targetZoom =

        Math.max(

          minZoom,

          Math.min(
            1,
            maxZoom
          )

        );


      await track.applyConstraints({

        advanced: [

          {

            zoom: targetZoom

          }

        ]

      });


      cameraStatus.innerText =
        "📷 กล้อง Zoom " +
        targetZoom.toFixed(1) +
        "x";


      console.log(
        "Camera zoom set to:",
        targetZoom
      );


    }

    else {

      cameraStatus.innerText =
        "📷 กล้องไม่รองรับการควบคุม Zoom";

    }

  }

  catch(error) {

    console.error(
      "Zoom error:",
      error
    );


    cameraStatus.innerText =
      "📷 ใช้ค่ากล้องเริ่มต้น";

  }

}



/* =====================================================
   รอ AR.js เปิดกล้อง
===================================================== */

setTimeout(

  forceCameraZoom1x,

  2000

);


/*
   ลองตั้งซ้ำอีกครั้ง
   เผื่อ AR.js เปิดกล้องช้า
*/

setTimeout(

  forceCameraZoom1x,

  4000

);


setTimeout(

  forceCameraZoom1x,

  6000

);



/* =====================================================
   ป้องกัน Pinch Zoom หน้าเว็บ
===================================================== */

document.addEventListener(

  "touchmove",

  function(e) {

    if (
      e.touches.length > 1
    ) {

      e.preventDefault();

    }

  },

  {
    passive: false
  }

);



/* =====================================================
   ป้องกัน Double Tap Zoom
===================================================== */

let lastTouchTime = 0;


document.addEventListener(

  "touchend",

  function(e) {

    const now =
      Date.now();


    if (
      now - lastTouchTime < 300
    ) {

      e.preventDefault();

    }


    lastTouchTime = now;

  },

  false

);

</script>
