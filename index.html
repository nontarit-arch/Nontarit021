  <script>

    // =========================================
    // ตั้งค่าความเร็ว
    // =========================================

    let speed = 1;

    let time = 0;



    // =========================================
    // เครื่องบินทั้ง 8 ลำ
    // =========================================

    const planes = [

      document.querySelector("#plane1"),

      document.querySelector("#plane2"),

      document.querySelector("#plane3"),

      document.querySelector("#plane4"),

      document.querySelector("#plane5"),

      document.querySelector("#plane6"),

      document.querySelector("#plane7"),

      document.querySelector("#plane8")

    ];



    const speedText =
      document.querySelector("#speedText");


    const speedButton =
      document.querySelector("#speedButton");



    // =========================================
    // ปุ่มเพิ่มความเร็ว
    // =========================================

    speedButton.addEventListener(
      "click",
      function () {

        speed += 0.5;


        if (speed > 5) {

          speed = 1;

        }


        speedText.innerText =
          "ความเร็ว: " +
          speed.toFixed(1) +
          "x";

      }
    );



    // =========================================
    // ฟังก์ชันเส้นทางเลข 8
    // =========================================

    function figureEight(
      t,
      phase,
      radiusX,
      radiusZ
    ) {

      const x =
        radiusX *
        Math.sin(t + phase);


      const z =
        radiusZ *
        Math.sin(t + phase) *
        Math.cos(t + phase);


      return {

        x: x,

        z: z

      };

    }



    // =========================================
    // Animation
    // =========================================

    function animate() {


      requestAnimationFrame(
        animate
      );


      time +=
        0.015 *
        speed;



      planes.forEach(
        function (
          plane,
          index
        ) {


          // ===================================
          // 8 ลำ
          // กระจายทุก 45 องศา
          // ===================================

          const phase =
            index *
            (
              Math.PI * 2 / 8
            );



          // ===================================
          // ขนาดวงบิน
          // แคบกว่าของเดิม
          // ===================================

          const pos =
            figureEight(

              time,

              phase,

              1.10,

              1.00

            );



          // ===================================
          // ความสูง
          // ===================================

          const height =

            0.65 +

            index * 0.12 +

            Math.sin(
              time * 2 +
              phase
            ) * 0.08;



          // ===================================
          // ตำแหน่ง
          // ===================================

          plane.object3D.position.x =
            pos.x;


          plane.object3D.position.y =
            height;


          plane.object3D.position.z =
            pos.z;



          // ===================================
          // คำนวณทิศทาง
          // ===================================

          const nextT =
            time + 0.01;



          const next =
            figureEight(

              nextT,

              phase,

              1.10,

              1.00

            );



          const dx =
            next.x -
            pos.x;


          const dz =
            next.z -
            pos.z;



          const angle =
            Math.atan2(
              dx,
              dz
            );



          // ===================================
          // หมุนเครื่องบิน
          // ===================================

          plane.object3D.rotation.y =
            angle;



          // ===================================
          // เอียงตอนเลี้ยว
          // ===================================

          const banking =

            Math.sin(
              time +
              phase
            ) * 0.25;


          plane.object3D.rotation.z =
            banking;

        }
      );

    }



    // =========================================
    // เริ่ม Animation
    // =========================================

    animate();



    // =========================================
    // Hiro Marker
    // =========================================

    const marker =
      document.querySelector(
        "#hiroMarker"
      );



    marker.addEventListener(
      "markerFound",
      function () {

        speedText.innerText =

          "พบ Hiro Marker • ความเร็ว: " +

          speed.toFixed(1) +

          "x";

      }
    );



    marker.addEventListener(
      "markerLost",
      function () {

        speedText.innerText =

          "ค้นหา Hiro Marker...";

      }
    );

  </script>
