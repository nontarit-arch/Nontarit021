<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D HDD Factory Digital Twin</title>
    <!-- A-Frame Framework for 3D/WebXR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        /* Overlay styling for info display when clicking machines */
        #info-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #38bdf8;
            pointer-events: none;
            display: none;
            text-align: center;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- UI Overlay for Click Feedback -->
    <div id="info-panel">Click a machine to inspect digital twin metrics...</div>

    <script>
        // Custom Component: Animate HDD Carriers along the conveyor belt (X-axis movement)
        AFRAME.registerComponent('carrier-conveyor', {
            schema: { speed: { type: 'number', default: 1.5 } },
            tick: function (time, timeDelta) {
                let pos = this.el.getAttribute('position');
                pos.x += (timeDelta / 1000) * this.data.speed;
                
                // Reset position to loop from M01 start (-7.5m) to M03 end (+7.5m)
                if (pos.x > 7.5) {
                    pos.x = -7.5;
                }
                this.el.setAttribute('position', pos);
            }
        });

        // Custom Component: Machine 01 Blue Robot Arm Pick-and-Place Cycle
        AFRAME.registerComponent('arm-m01-anim', {
            tick: function (time) {
                let t = (time % 4000) / 4000; // 4-second loop cycle
                let base = this.el.querySelector('.arm-base');
                let shoulder = this.el.querySelector('.arm-shoulder');
                let elbow = this.el.querySelector('.arm-elbow');

                if (base && shoulder && elbow) {
                    // Smooth sinusoidal interpolation for rotation angles
                    let rotY = Math.sin(t * Math.PI * 2) * 40;
                    let rotXShoulder = Math.sin(t * Math.PI * 2) * 15 - 10;
                    let rotXElbow = Math.cos(t * Math.PI * 2) * 20 + 10;

                    base.setAttribute('rotation', `0 ${rotY} 0`);
                    shoulder.setAttribute('rotation', `${rotXShoulder} 0 0`);
                    elbow.setAttribute('rotation', `${rotXElbow} 0 0`);
                }
            }
        });

        // Custom Component: Machine 02 Orange 3-Joint Robot Assembly Animation Cycle
        AFRAME.registerComponent('arm-m02-anim', {
            tick: function (time) {
                let t = (time % 3000) / 3000; // 3-second loop cycle
                let base = this.el.querySelector('.arm-base');
                let shoulder = this.el.querySelector('.arm-shoulder');
                let elbow = this.el.querySelector('.arm-elbow');
                let wrist = this.el.querySelector('.arm-wrist');

                if (base && shoulder && elbow && wrist) {
                    let rotY = Math.sin(t * Math.PI * 2) * 60;
                    let rotXShoulder = Math.sin(t * Math.PI * 2) * 25 - 15;
                    let rotXElbow = -Math.abs(Math.sin(t * Math.PI * 2)) * 30;
                    let rotXWrist = Math.sin(t * Math.PI * 2) * 20;

                    base.setAttribute('rotation', `0 ${rotY} 0`);
                    shoulder.setAttribute('rotation', `${rotXShoulder} 0 0`);
                    elbow.setAttribute('rotation', `${rotXElbow} 0 0`);
                    wrist.setAttribute('rotation', `${rotXWrist} 0 0`);
                }
            }
        });

        // Custom Component: Machine 03 Compact Yellow Loader Arm Animation Cycle
        AFRAME.registerComponent('arm-m03-anim', {
            tick: function (time) {
                let t = (time % 2500) / 2500; // 2.5-second loop cycle
                let base = this.el.querySelector('.arm-base');
                let elbow = this.el.querySelector('.arm-elbow');

                if (base && elbow) {
                    let rotY = Math.cos(t * Math.PI * 2) * 35 + 20;
                    let rotXElbow = Math.sin(t * Math.PI * 2) * 25;

                    base.setAttribute('rotation', `0 ${rotY} 0`);
                    elbow.setAttribute('rotation', `${rotXElbow} 0 0`);
                }
            }
        });

        // Interactive Machine Click Handler
        AFRAME.registerComponent('machine-interactive', {
            schema: { name: { type: 'string', default: 'Machine' } },
            init: function () {
                let el = this.el;
                let name = this.data.name;
                let panel = document.getElementById('info-panel');

                el.addEventListener('click', function () {
                    panel.style.display = 'block';
                    panel.innerHTML = `<strong>[SELECTED TWIN]</strong>: ${name} | Status: OPERATIONAL | Cycle Time: 2.4s`;
                    setTimeout(() => { panel.style.display = 'none'; }, 4000);
                });
            }
        });
    </script>

    <!-- 3D Scene Container -->
    <a-scene background="color: #1A202C">

        <!-- Camera Rig with WASD & Mouse Look Controls -->
        <a-entity id="rig" position="0 2.5 7" rotation="-12 0 0">
            <a-camera look-controls camera>
                <!-- Raycaster Cursor for Object Interaction -->
                <a-cursor raycaster="objects: .clickable" material="color: #FFCC00; shader: flat" radius-inner="0.002" radius-outer="0.005"></a-cursor>
            </a-camera>
        </a-entity>

        <!-- Lighting Setup -->
        <a-light type="ambient" color="#ffffff" intensity="0.55"></a-light>
        <a-light type="directional" position="5 10 7" intensity="0.75" cast-shadow="true"></a-light>

        <!-- ================= ENVIRONMENT ================= -->
        <!-- Gray Industrial Floor -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="22" height="14" color="#33373E" roughness="0.8"></a-plane>
        
        <!-- Overhead Ceiling Light Fixtures -->
        <a-entity id="ceiling-lights">
            <a-box position="-5 5.8 0" width="3" height="0.1" depth="0.4" color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 0.8"></a-box>
            <a-box position="0 5.8 0" width="3" height="0.1" depth="0.4" color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 0.8"></a-box>
            <a-box position="5 5.8 0" width="3" height="0.1" depth="0.4" color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 0.8"></a-box>
        </a-entity>

        <!-- Blue-Gray Factory Enclosure Walls -->
        <a-box position="0 3 -6.9" width="22" height="6" depth="0.2" color="#2C3540"></a-box>
        <a-box position="-10.9 3 0" width="0.2" height="6" depth="14" color="#2C3540"></a-box>
        <a-box position="10.9 3 0" width="0.2" height="6" depth="14" color="#2C3540"></a-box>

        <!-- Safety Green Walkway Path -->
        <a-plane position="0 0.02 3" rotation="-90 0 0" width="20" height="1.6" color="#28A745" opacity="0.85"></a-plane>

        <!-- ================= SAFETY ZONES ================= -->
        <a-plane position="-5.5 0.02 0" rotation="-90 0 0" width="3.2" height="3.2" color="#FFCC00" opacity="0.4"></a-plane>
        <a-plane position="0 0.02 0" rotation="-90 0 0" width="3.2" height="3.2" color="#FFCC00" opacity="0.4"></a-plane>
        <a-plane position="5.5 0.02 0" rotation="-90 0 0" width="3.2" height="3.2" color="#FFCC00" opacity="0.4"></a-plane>

        <!-- ================= CONVEYOR BELT SYSTEM ================= -->
        <a-entity id="conveyors">
            <!-- Conveyor Line 1 (Connecting M01 to M02) -->
            <a-box position="-2.75 0.85 0" width="3.0" height="0.15" depth="0.5" color="#1C2833"></a-box>
            <a-cylinder position="-4.0 0.42 0" radius="0.04" height="0.85" color="#7F8C8D"></a-cylinder>
            <a-cylinder position="-1.5 0.42 0" radius="0.04" height="0.85" color="#7F8C8D"></a-cylinder>

            <!-- Conveyor Line 2 (Connecting M02 to M03) -->
            <a-box position="2.75 0.85 0" width="3.0" height="0.15" depth="0.5" color="#1C2833"></a-box>
            <a-cylinder position="1.5 0.42 0" radius="0.04" height="0.85" color="#7F8C8D"></a-cylinder>
            <a-cylinder position="4.0 0.42 0" radius="0.04" height="0.85" color="#7F8C8D"></a-cylinder>

            <!-- Dynamic Animated HDD Carriers Moving Along Belts -->
            <a-entity carrier-conveyor="speed: 1.2" position="-7.5 0.96 0">
                <a-box width="0.35" height="0.04" depth="0.3" color="#D5D8DC"></a-box>
                <a-cylinder position="0 0.03 0" radius="0.08" height="0.01" color="#A6ACAF"></a-cylinder>
            </a-entity>
            <a-entity carrier-conveyor="speed: 1.2" position="-2.0 0.96 0">
                <a-box width="0.35" height="0.04" depth="0.3" color="#D5D8DC"></a-box>
                <a-cylinder position="0 0.03 0" radius="0.08" height="0.01" color="#A6ACAF"></a-cylinder>
            </a-entity>
            <a-entity carrier-conveyor="speed: 1.2" position="3.5 0.96 0">
                <a-box width="0.35" height="0.04" depth="0.3" color="#D5D8DC"></a-box>
                <a-cylinder position="0 0.03 0" radius="0.08" height="0.01" color="#A6ACAF"></a-cylinder>
            </a-entity>
        </a-entity>

        <!-- ================= MACHINE 01: PRECISION DISK WEIGHING ================= -->
        <a-entity id="machine-01" position="-5.5 0 0" class="clickable" machine-interactive="name: M01 - Precision Disk Weighing">
            <!-- Main Machine Body (White & Blue Accent) -->
            <a-box position="0 0.8 0" width="2
